; Pin platform and libraries to exact versions after the first build (pio pkg list); firmware is the tier nobody can re-run to check a change (Rule 10).

[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
monitor_speed = 115200

; The firmware's logic, tested on the host: pio test -e native
[env:native]
platform = native
test_framework = unity
