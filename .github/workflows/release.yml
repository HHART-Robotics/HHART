name: release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: The tag matches every version and has a changelog entry
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$v\"" python/pyproject.toml
          grep -q "<version>$v</version>" python/package.xml
          grep -q "^version: $v" CITATION.cff
          grep -q "__version__ = \"$v\"" python/src/hhart/__init__.py
          grep -q "\"version\": \"$v\"" ui/package.json
          grep -q "^## \[$v\]" CHANGELOG.md
      - uses: astral-sh/setup-uv@v10.3.3  # No major tags past v7
      # Wheel from source tree, sdist lacks ../template
      - run: uv build --sdist python --out-dir dist && uv build --wheel python --out-dir dist
      # Before the GitHub release, so a failed upload leaves no release
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
      - run: awk -v v="## [${GITHUB_REF_NAME#v}]" 'index($0, v) == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}

  mirror:
    needs: release
    uses: ./.github/workflows/mirror.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
